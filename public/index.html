<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DrawCompanion</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="hint" role="status">Starting camera…</div>
    </div>

    <section id="panel">
      <div class="row">
        <select id="paper" aria-label="Paper size">
          <option value="a4">A4 template</option>
          <option value="letter">US Letter template</option>
        </select>
        <a id="template" href="template.html?size=a4" target="_blank">Print template</a>
        <button id="enter-headset" class="primary">Headset view</button>
      </div>

      <div class="row">
        <input id="request" type="text" placeholder="Drag a box on the page, then: e.g. “a cat sitting here”">
        <button id="mic" title="Talk" aria-label="Talk">🎤</button>
      </div>

      <div class="row">
        <div id="modes" role="radiogroup" aria-label="Suggestion type">
          <label><input type="radio" name="mode" value="outline" checked> Outline</label>
          <label><input type="radio" name="mode" value="scaffold"> Guides only</label>
          <label><input type="radio" name="mode" value="options"> 3 ideas</label>
        </div>
        <button id="ask">Suggest</button>
      </div>

      <div id="result" hidden>
        <p id="understood"></p>
        <div id="palette"></div>
        <ol id="steps"></ol>
        <div class="row">
          <input id="feedback" type="text" placeholder="Not quite? e.g. “smaller, facing left”">
          <button id="change">Change it</button>
        </div>
        <div class="row">
          <button id="prev" hidden>‹ Idea</button>
          <button id="next" hidden>Idea ›</button>
          <button id="dismiss">Hide outline</button>
        </div>
      </div>
    </section>
  </main>
  <script src="vendor/js-aruco2/cv.js"></script>
  <script src="vendor/js-aruco2/aruco.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
