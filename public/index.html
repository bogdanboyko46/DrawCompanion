<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DrawCompanion</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="hint" role="status">Starting camera…</div>
    </div>

    <section id="panel">
      <div class="row">
        <select id="paper" aria-label="Paper size">
          <option value="a4">A4 template</option>
          <option value="letter">US Letter template</option>
        </select>
        <a id="template" href="template.html?size=a4" target="_blank">Print template</a>
      </div>
      <div class="row">
        <button id="listen">Start listening</button>
        <button id="enter-headset" class="primary">Headset view</button>
        <button id="hide" disabled>Hide outline</button>
      </div>
      <div class="row">
        <input id="say" type="text" placeholder="Or type what you'd say, then Enter">
      </div>
      <p id="heard"></p>
    </section>
  </main>
  <script src="vendor/js-aruco2/cv.js"></script>
  <script src="vendor/js-aruco2/aruco.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
